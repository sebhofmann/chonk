name: CI

on:
  push:
    branches: [master]
    # Reine Doku-Änderungen brauchen keinen Build.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Ohne Debug-Infos baut es schneller und der Cache bleibt kleiner.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Speichert Registry und kompilierte Abhängigkeiten. Auch nach einem
      # fehlgeschlagenen Lauf, damit der nächste Versuch nicht bei null beginnt.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Linux-Abhängigkeiten installieren
        if: runner.os == 'Linux'
        run: ./script/linux-deps.sh

      - name: Formatierung
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked
