name: Release

# Startet, sobald auf GitHub ein Release veröffentlicht wird ("Publish release").
# Baut die App für alle Plattformen und hängt die Pakete an dieses Release.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Linux bauen und packen
        if: runner.os == 'Linux'
        run: |
          ./script/linux-deps.sh
          cargo build --release --locked
          tar -C target/release -czf "chonk-$TAG-linux-x86_64.tar.gz" chonk
          gh release upload "$TAG" "chonk-$TAG-linux-x86_64.tar.gz" --clobber

      - name: macOS bauen und packen
        if: runner.os == 'macOS'
        run: |
          ./script/bundle-macos.sh "${TAG#v}" "Chonk-$TAG-macos-universal.zip"
          gh release upload "$TAG" "Chonk-$TAG-macos-universal.zip" --clobber

      - name: Windows bauen und packen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          $zip = "chonk-$env:TAG-windows-x86_64.zip"
          Compress-Archive -Path target/release/chonk.exe -DestinationPath $zip
          gh release upload $env:TAG $zip --clobber
